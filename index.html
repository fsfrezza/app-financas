<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Controle Financeiro Simples</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1976d2" />

  <link rel="stylesheet" href="css/estilo.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
</head>
<body>
  <h1>Controle de Gastos & Investimentos</h1>

  <h2>Novo Lançamento</h2>
  <div id="editandoAviso" class="editando-avisos" style="display:none;">
    Editando lançamento... (<span id="editandoDescricao"></span>)
  </div>

  <form id="formTransacao">
    <div>
      <label for="data">Data</label>
      <input type="date" id="data" required />
    </div>

    <div>
      <label for="descricao">Descrição</label>
      <input type="text" id="descricao" required />
    </div>

    <div>
      <label for="tipo">Tipo</label>
      <select id="tipo">
        <option value="DESPESA">Despesa</option>
        <option value="RECEITA">Receita</option>
      </select>
    </div>

    <div>
      <label for="tipoCusto">Tipo de Custo</label>
      <select id="tipoCusto">
        <option value="CASUAL">Casual</option>
        <option value="MENSAL">Mensal</option>
        <option value="ANUAL">Anual</option>
      </select>
    </div>

    <div>
      <label for="categoria">Categoria</label>
      <input type="text" id="categoria" placeholder="Alimentação, Moradia..." />
    </div>

    <div>
      <label for="conta">Conta</label>
      <input type="text" id="conta" placeholder="Nubank, Itaú..." />
    </div>

    <div>
      <label for="valor">Valor</label>
      <input type="number" step="0.01" id="valor" required />
    </div>

    <div>
      <label for="ehInvestimento">É investimento?</label>
      <select id="ehInvestimento">
        <option value="false">Não</option>
        <option value="true">Sim</option>
      </select>
    </div>

    <div class="botoes-form">
      <button type="submit" id="btnSalvar">Adicionar lançamento</button>
      <button type="button" id="btnCancelarEdicao" style="display:none;">
        Cancelar edição
      </button>
    </div>
  </form>

  <h2>Lançamentos</h2>
  <table>
    <thead>
      <tr>
        <th>Data</th>
        <th>Descrição</th>
        <th>Tipo</th>
        <th>Tipo Custo</th>
        <th>Categoria</th>
        <th>Conta</th>
        <th>Valor</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="listaTransacoes"></tbody>
  </table>

  <section id="resumoMensal">
    <h2>Resumo Mensal</h2>
    <div class="linha-resumo">
      <label for="mesResumo">Mês:</label>
      <input type="month" id="mesResumo">
    </div>

    <div class="resumo-grid">
      <div class="card-resumo">
        <div class="titulo-card">Receitas</div>
        <div class="valor-card positivo" id="resumoReceitas">R$ 0,00</div>
      </div>
      <div class="card-resumo">
        <div class="titulo-card">Despesas</div>
        <div class="valor-card negativo" id="resumoDespesas">R$ 0,00</div>
      </div>
      <div class="card-resumo">
        <div class="titulo-card">Saldo</div>
        <div class="valor-card" id="resumoSaldo">R$ 0,00</div>
      </div>
    </div>
  </section>

  <section id="graficoSection">
    <h2>Gráfico Mensal</h2>
    <canvas id="graficoMensal"></canvas>
  </section>

  <!-- Chart.js CDN para o gráfico -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script src="js/transacao.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
